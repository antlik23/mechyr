# for custom dev credentials create `database_dev.yml` file with following structure

#development:
#  username: dev_username
#  password: dev_password

#test:
#  username: test_username
#  password: test_password

default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5

development:
  <<: *default
  host: localhost
  database: ovladni_mechyr_development
  username: <%= (YAML.load_file('config/database_dev.yml')['development']['username'] rescue nil) || 'ovladni_mechyr_development' %>
  password: <%= (YAML.load_file('config/database_dev.yml')['development']['password'] rescue nil) || 'ovladni_mechyr_development' %>

test:
  <<: *default
  host: <%= ENV['CI'] ? 'postgres' : 'localhost' %>
  database: ovladni_mechyr_test
  username: <%= (YAML.load_file('config/database_dev.yml')['test']['username'] rescue nil) || 'ovladni_mechyr_test' %>
  password: <%= (YAML.load_file('config/database_dev.yml')['test']['password'] rescue nil) || 'ovladni_mechyr_test' %>

beta:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>

